<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Styled Component</title>
    <style>
.topnav {
  overflow: hidden;
  background-color: #285e97ff;
}

.topnav a {
  float: left;
  color: #f2f2f2;
  text-align: center;
  padding: 18px 20px;
  text-decoration: none;
  font-size: 20px;
}

.topnav a:hover {
  background-color: #ffd400ff;
  color: rgb(255, 255, 255);
}

.topnav a.active {
  background-color: #ffd400ff;
  color: #285e97ff;
}/* The main container box */

.container-box {
    border: 2px solid #ccc; 
    background-color: #eee; 
    border-radius: 5px; 
    padding: 16px; 
    margin: 16px 0;
}

/* The floating profile/avatar image */
.avatar-image {
    float: left; 
    margin-right: 20px; 
    border-radius: 50%;
    width: 60px; /* Added a default size so the circle renders correctly */
    height: 60px;
}

/* The text content next to the image */
.text-content {
    font-size: 20px; 
     margin-right: 15px;
    }

/* The clearfix hack to fix the layout container from collapsing */
.clearfix::after {
    content: ""; 
    clear: both; 
    display: table;
    }
    
.grid-container {
  display: grid;
  grid-template-columns: 33% 33% 33%;
  place-items: center; /* Centers both horizontally and vertically */
  height: 500px;
  background-color: #285e97ff;
  color: #ffd400ff;
  gap: 50px;
  padding: 20px;
  text-align: center;

}
.copy-container{
    background-color: #285e97ff;
  color: #ffd400ff;
  gap: 50px;
  padding: 20px;
  text-align: center;
}
.map-div {
  grid-column: span 2;            /* Forces the map to drop below and take up both columns */
  display: flex;
  justify-content: center;        /* Perfectly centers the iframe inside the map-div */
  width: 100%;
}    
    </style>
</head>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        /* Style the link to look like a professional button */
        .apply-button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 18px;
            color: white;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        .apply-button:hover {
            background-color: #0056b3;
        }

        /* Style the submit button with a specific background color etc */
input[type=submit] {
  background-color: #285e97ff;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* When moving the mouse over the submit button, add a darker green color */
input[type=submit]:hover {
  background-color: #72a0ad;
}

/* Add a background color and some padding around the form */
.container {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}
.apply-button:active {
    transform: translateY(0); /* Sinks back down when clicked */
  }
  /* Style inputs with type="text", select elements and textareas */
input[type=text], select, textarea {
  width: 100%; /* Full width */
  padding: 12px; /* Some padding */ 
  border: 1px solid #ccc; /* Gray border */
  border-radius: 4px; /* Rounded borders */
  box-sizing: border-box; /* Make sure that padding and width stays in place */
  margin-top: 6px; /* Add a top margin */
  margin-bottom: 16px; /* Bottom margin */
  resize: vertical /* Allow the user to vertically resize the textarea (not horizontally) */
}
    
  </style>

</head>
<body>

    <h2>To Apply for a course</h2>
    <p>Click the button below.</p>
    
    <a href="https://www.csgcc.ac.uk/en/courses-subject-area" target="_blank" class="apply-button">
        Start Application
    </a>

<div class="container">
  <form action="action_page.php">

    <label for="fname">First Name</label>
    <input type="text" id="fname" name="firstname" placeholder="Your name..">

    <label for="lname">Last Name</label>
    <input type="text" id="lname" name="lastname" placeholder="Your last name..">

    <label for="course">Course</label>
    <select id="course" name="course">
      <option value="Level 2">Level 2</option>
      <option value="Level 3">Level 3</option>
    </select>

    <label for="subject">Subject</label>
    <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px"></textarea>

    <input type="submit" value="Submit">

  </form>
</div>



</body>
</html>
