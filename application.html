<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Component</title>
    <style>
.topnav {
  overflow: hidden;
  background-color: #285e97ff;
}

.topnav a {
  float: left;
  color: #f2f2f2;
  text-align: center;
  padding: 18px 20px;
  text-decoration: none;
  font-size: 20px;
}

.topnav a:hover {
  background-color: #ffd400ff;
  color: rgb(255, 255, 255);
}

.topnav a.active {
  background-color: #ffd400ff;
  color: #285e97ff;
}/* The main container box */

.container-box {
    border: 2px solid #ccc; 
    background-color: #eee; 
    border-radius: 5px; 
    padding: 16px; 
    margin: 16px 0;
}

/* The floating profile/avatar image */
.avatar-image {
    float: left; 
    margin-right: 20px; 
    border-radius: 50%;
    width: 60px; /* Added a default size so the circle renders correctly */
    height: 60px;
}

/* The text content next to the image */
.text-content {
    font-size: 20px; 
     margin-right: 15px;
    }

/* The clearfix hack to fix the layout container from collapsing */
.clearfix::after {
    content: ""; 
    clear: both; 
    display: table;
    }
    
.grid-container {
  display: grid;
  grid-template-columns: 33% 33% 33%;
  place-items: center; /* Centers both horizontally and vertically */
  height: 500px;
  background-color: #285e97ff;
  color: #ffd400ff;
  gap: 50px;
  padding: 20px;
  text-align: center;

}
.copy-container{
    background-color: #285e97ff;
  color: #ffd400ff;
  gap: 50px;
  padding: 20px;
  text-align: center;
}
.map-div {
  grid-column: span 2;            /* Forces the map to drop below and take up both columns */
  display: flex;
  justify-content: center;        /* Perfectly centers the iframe inside the map-div */
  width: 100%;
}    
    </style>
</head>

<body>
   
<div class="topnav">
  <a href="index.html"><img src="assets\logoClipped.png" alt="Coleg Ceredigion Logo" style="width:100px;height:30px;"></a>
  <a href="courses.html">Course Information</a>
  <a href="app.html">App Information</a>
  <a href="testimonials.html">Testimonials</a>
  <a class="active" href="application.html">Apply Now</a>
</div>

</html>
